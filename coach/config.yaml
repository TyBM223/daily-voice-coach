# Coach settings. Restart the coach after editing.

owner_name: Ty
timezone: America/New_York

location:
  name: Tampa
  lat: 27.9506
  lon: -82.4572

temperature_unit: fahrenheit   # or celsius

language_to_learn: Portuguese   # needs content_data/phrases_<language>.json (Spanish and Portuguese included)

voice: en-GB-RyanNeural         # any edge-tts voice name
phrase_voice: pt-BR-AntonioNeural # speaks the phrase; match it to language_to_learn (Spanish: es-MX-JorgeNeural)

schedule:
  # A time like "09:00", or wake: the briefing comes when you tap "I'm up"
  # (or send any message) in Telegram.
  morning_weekdays: "09:00"   # Monday to Friday
  morning_weekends: wake
  wake_earliest: "06:00"      # on wake days, messages before this don't count
  wake_latest: "12:00"        # on wake days, sent anyway at this time if you haven't tapped
  midday: "12:30"    # weekdays only: what's left today (skipped if there are no tasks)
  evening: "18:00"   # every day: how today went, and tomorrow's first task and weather

# What the daily content slot holds on each weekday.
# phrase_review repeats that week's Monday phrase; mix rotates fact / history / joke.
content_rotation:
  monday: phrase
  tuesday: fact
  wednesday: history
  thursday: joke
  friday: phrase_review
  saturday: mix
  sunday: mix

# Teams to follow, from ESPN's public data (see coach/sources/sports.py). team is ESPN's team ID:
# the number in the team's espn.com URL. leagues are ESPN's sport/league paths; a soccer club can
# list its cups too. keywords mark a headline as being about the team (default: the name).
teams:
  - name: 49ers
    team: "25"
    leagues: [football/nfl]
    keywords: [49ers, Niners]
  - name: Heat
    team: "14"
    leagues: [basketball/nba]
  - name: Auburn
    team: "2"
    leagues: [football/college-football]
  - name: Chelsea
    team: "363"
    leagues: [soccer/eng.1, soccer/eng.league_cup, soccer/eng.fa]

use_llm: false   # v2 option: local Ollama writes the script
